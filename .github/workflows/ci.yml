name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the engine (POSIX sh)
        run: shellcheck -x -s sh bin/homedir-manager lib/*.sh bootstrap

  sh-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the POSIX sh test suite
        run: sh test/run.sh

  macos-defaults:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test the macos-defaults Swift helper
        working-directory: macos
        run: |
          swift build
          swift test
