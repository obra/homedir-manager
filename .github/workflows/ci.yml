name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck v0.11.0 (pinned so CI matches local)
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck the engine (POSIX sh)
        run: shellcheck -x -s sh bin/homedir-manager lib/*.sh bootstrap

  sh-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the POSIX sh test suite
        run: sh test/run.sh

  macos-defaults:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test the macos-defaults Swift helper
        working-directory: macos
        run: |
          swift build
          swift test
